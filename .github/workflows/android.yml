name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Godot
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          rm godot.zip
          godot --version

      # 匯出模板約 1.3GB，只解出 Android 需要的檔案並快取。
      - name: Cache Android export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-android-templates
          key: godot-android-templates-${{ env.GODOT_RELEASE }}

      - name: Download Android export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          mkdir -p ~/godot-android-templates
          unzip -j -q templates.tpz "templates/android_*" "templates/version.txt" -d ~/godot-android-templates
          rm templates.tpz
          ls -la ~/godot-android-templates

      - name: Configure Godot editor
        run: |
          TEMPLATE_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TEMPLATE_DIR" ~/.config/godot
          cp ~/godot-android-templates/* "$TEMPLATE_DIR/"
          cat > ~/.config/godot/editor_settings-4.7.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          cat ~/.config/godot/editor_settings-4.7.tres

      # 固定的 debug 簽章（存在 repo secret），每次建置簽章相同，手機上可以直接覆蓋安裝。
      # 沒有 secret（例如 fork 的 PR）就臨時產生一把。
      - name: Prepare debug keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 未設定，使用臨時簽章"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project
        run: godot --headless --path . --import

      - name: Run tests
        run: |
          godot --headless --path . -s res://tests/run_tests.gd
          godot --headless --path . -s res://tests/ui_smoke.gd

      - name: Set version
        id: version
        run: |
          VERSION_NAME=$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)
          VERSION_CODE=${{ github.run_number }}
          sed -i "s/^version\/code=.*/version\/code=${VERSION_CODE}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"${VERSION_NAME}\"/" export_presets.cfg
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "版本 ${VERSION_NAME}（code ${VERSION_CODE}）"

      - name: Export debug APK
        run: |
          mkdir -p build
          APK="build/islog-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-debug.apk"
          godot --headless --path . --export-debug "Android" "$APK"
          test -s "$APK"
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: islog-v${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}-debug-apk
          path: build/*.apk
          retention-days: 30
